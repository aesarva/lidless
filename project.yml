name: Lidless
options:
  bundleIdPrefix: io.github.aesarva
  deploymentTarget:
    macOS: "14.0"
# One version for the app and the daemon: a mismatch makes the app re-register the daemon on
# every launch. Both targets inherit these.
settings:
  base:
    MARKETING_VERSION: "0.4.1"
    CURRENT_PROJECT_VERSION: "1"
packages:
  LidlessCore:
    path: Packages/LidlessCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  Lidless:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: App
      # launchd plist of the daemon, registered via SMAppService.daemon(plistName:).
      - path: LidlessHelper/io.github.aesarva.Lidless.helper.plist
        buildPhase:
          copyFiles: {destination: wrapper, subpath: Contents/Library/LaunchDaemons}
    dependencies:
      - package: LidlessCore
      # Auto-updates; Xcode embeds Sparkle.framework in Contents/Frameworks.
      - package: Sparkle
      - target: LidlessHelper
        embed: true
        copy: {destination: executables}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.aesarva.Lidless
        PRODUCT_NAME: Lidless
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "-"
        ENABLE_APP_SANDBOX: NO
        INFOPLIST_FILE: App/Resources/Info.plist
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # Hardened runtime only in Release: its library validation refuses Sparkle.framework in an
      # ad-hoc (Debug) build, which has no Team ID. scripts/build-app.sh re-signs the Release
      # build and keeps it only for a Developer ID.
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
  LidlessHelper:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: LidlessHelper
        excludes:
          - "*.plist"
    dependencies:
      - package: LidlessCore
    settings:
      base:
        PRODUCT_NAME: LidlessHelper
        PRODUCT_BUNDLE_IDENTIFIER: io.github.aesarva.Lidless.helper
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "-"
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
