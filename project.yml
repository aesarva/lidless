name: Lidless
options:
  bundleIdPrefix: io.github.aesarva
  deploymentTarget:
    macOS: "14.0"
packages:
  LidlessCore:
    path: Packages/LidlessCore
targets:
  Lidless:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: App
      # Explicit files (not the folder) so Helper/tests/ is not bundled.
      - path: Helper/install.sh
        buildPhase:
          copyFiles: {destination: resources, subpath: Helper}
      - path: Helper/uninstall.sh
        buildPhase:
          copyFiles: {destination: resources, subpath: Helper}
      - path: Helper/watchdog.sh
        buildPhase:
          copyFiles: {destination: resources, subpath: Helper}
      - path: Helper/app.lidless.watchdog.plist
        buildPhase:
          copyFiles: {destination: resources, subpath: Helper}
      # launchd plist of the daemon, registered via SMAppService.daemon(plistName:).
      - path: LidlessHelper/io.github.aesarva.Lidless.helper.plist
        buildPhase:
          copyFiles: {destination: wrapper, subpath: Contents/Library/LaunchDaemons}
    dependencies:
      - package: LidlessCore
      - target: LidlessHelper
        embed: true
        copy: {destination: executables}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.aesarva.Lidless
        PRODUCT_NAME: Lidless
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "-"
        ENABLE_APP_SANDBOX: NO
        INFOPLIST_FILE: App/Resources/Info.plist
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.2.0"
  LidlessHelper:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: LidlessHelper
        excludes:
          - "*.plist"
    dependencies:
      - package: LidlessCore
    settings:
      base:
        PRODUCT_NAME: LidlessHelper
        PRODUCT_BUNDLE_IDENTIFIER: io.github.aesarva.Lidless.helper
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "-"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.2.0"
