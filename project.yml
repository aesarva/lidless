name: Lidless
options:
  bundleIdPrefix: io.github.alexsarva
  deploymentTarget:
    macOS: "14.0"
packages:
  LidlessCore:
    path: Packages/LidlessCore
targets:
  Lidless:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: App
      # Explicit files (not the folder) so Helper/tests/ is not bundled.
      - path: Helper/install.sh
        buildPhase:
          copyFiles: {destination: resources, subpath: Helper}
      - path: Helper/uninstall.sh
        buildPhase:
          copyFiles: {destination: resources, subpath: Helper}
      - path: Helper/watchdog.sh
        buildPhase:
          copyFiles: {destination: resources, subpath: Helper}
      - path: Helper/app.lidless.watchdog.plist
        buildPhase:
          copyFiles: {destination: resources, subpath: Helper}
    dependencies:
      - package: LidlessCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.alexsarva.Lidless
        PRODUCT_NAME: Lidless
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "-"
        ENABLE_APP_SANDBOX: NO
        INFOPLIST_FILE: App/Resources/Info.plist
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
